<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$GODOT_PROJECT_NAME</title>
    <style>
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
        body { background-color: #00012b; }
        #container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        #canvas { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }
        #loading-track {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(1110px, calc(100vw - 48px));
            transform: translateX(-50%);
        }
        #loading-track progress { display: block; width: 100%; height: 16px; }
        #loading-characters {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 0;
            width: 100%;
            height: clamp(72px, 60vw, 250px);
        }
        #loading-characters img {
            position: absolute;
            bottom: 0;
            width: auto;
            height: 100%;
            max-width: 25%;
            object-fit: contain;
        }
        #loading-mouse { left: 0; transform: translateX(-100%); }
        #loading-bear { right: 0; transform: translateX(100%); }
        #loading-heart {
            left: 100%;
            bottom: calc(100% + 8px);
            width: clamp(40px, 8vw, 96px);
            height: auto;
            transform: translateX(-50%) translateY(-100%);
        }
    </style>
    $GODOT_HEAD_INCLUDE
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
    </div>
    <script src="$GODOT_URL"></script>
    <script>
        const container = document.getElementById("container")
        let track
        let mouse
        let heart
        let progressBar
        function buildLoadingScreen() {
            track = document.createElement("div")
            track.id = "loading-track"
            let characters = document.createElement("div")
            characters.id = "loading-characters"

            mouse = document.createElement("img")
            mouse.id = "loading-mouse"
            mouse.src = "mouse.webp"
            mouse.alt = ""

            let bear = document.createElement("img")
            bear.id = "loading-bear"
            bear.src = "bear.webp"
            bear.alt = ""

            heart = document.createElement("img")
            heart.id = "loading-heart"
            heart.src = "heart.webp"
            heart.alt = ""
            heart.hidden = true

            progressBar = document.createElement("progress")
            progressBar.max = 1
            progressBar.value = 0
            progressBar.setAttribute("aria-label", "Loading")

            characters.append(mouse, bear, heart)
            track.append(characters, progressBar)
            container.appendChild(track)
        }
        function applyProgress(progress) {
            progress = Math.max(0, Math.min(1, progress))
            mouse.style.left = `${progress * 100}%`
            if (progress >= 0.95) {
                heart.hidden = false
            }
            if (progress >= 1) {
              track.hidden = true
            }
            progressBar.value = progress
        }
        buildLoadingScreen()
        applyProgress(0)
        const engine = new Engine($GODOT_CONFIG);
        engine.startGame({
            onProgress: function (current, total) {
                if (total > 0) {
                  applyProgress(current / total)
                }
            }
        });
    </script>
</body>
</html>
